groups:
  - name: guardian
    rules:
      - alert: GuardianDown
        expr: up{job="guardian"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "guardian no responde en /metrics"

      - alert: GuardianHighErrorRate
        expr: |
          sum(rate(guardian_http_requests_total{code=~"5.."}[5m]))
            / sum(rate(guardian_http_requests_total[5m])) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Más del 5% de los requests terminan en 5xx"

      - alert: GuardianHighLatencyP99
        expr: |
          histogram_quantile(0.99,
            sum by (le) (rate(guardian_http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "p99 por encima de 500 ms"

      - alert: GuardianFailOpen
        expr: sum by (reason) (rate(guardian_fail_open_total[5m])) > 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "guardian está usando el limitador local ({{ $labels.reason }}): revisa Valkey"

      - alert: GuardianConfigReloadFailing
        expr: guardian_config_last_reload_successful == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "guardian rechazó la última config y sigue con la anterior: busca config_recarga_fallida en el log"

      - alert: GuardianAdminAuthFailures
        expr: sum(increase(guardian_admin_auth_failures_total[10m])) > 20
        labels: { severity: warning }
        annotations:
          summary: "Más de 20 requests sin token válido a la Admin API en 10 minutos: alguien está probando tokens"

      - alert: GuardianACLLookupErrors
        expr: sum(rate(guardian_acl_lookup_errors_total[5m])) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "guardian no puede leer los bloqueos de la Admin API en Valkey (fail-open): los bloqueos nuevos no se están aplicando"
