# Override que apunta guardian a Floci (AWS local) en vez de al log.
#
#   docker compose --profile aws -f docker-compose.yml -f docker-compose.aws.yml up -d --build --force-recreate guardian
#
# Por defecto usa guardian.sqs.yml. Para Kinesis:
#   GUARDIAN_EVENTS_SINK=kinesis docker compose --profile aws -f docker-compose.yml -f docker-compose.aws.yml up -d --force-recreate guardian
#
# SIEMPRE con --profile aws: aws-init y floci pertenecen a ese profile y
# guardian depende de ellos aquí.
services:
  guardian:
    environment:
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://floci:4566   # el SDK v2 lo lee solo: no hay endpoint en el YAML
      AWS_ACCESS_KEY_ID: test               # credenciales falsas: solo valen para Floci
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      # Mismo destino que en docker-compose.yml: este archivo reemplaza al guardian.yml normal.
      - ./guardian.${GUARDIAN_EVENTS_SINK:-sqs}.yml:/etc/guardian/guardian.yml:ro
    depends_on:
      aws-init: { condition: service_completed_successfully }