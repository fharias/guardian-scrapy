name: guardian

services:
  floci:              # emulador de AWS local: docker compose --profile aws up -d floci
    profiles: ["aws"]
    image: floci/floci:2.4.0
    environment:
      FLOCI_HOSTNAME: floci   # las URLs de colas que devuelve apuntan a http://floci:4566/...
    ports:
      - "127.0.0.1:4566:4566" # solo tu laptop. Nunca 0.0.0.0: Floci no tiene autenticación real
    # SIN /var/run/docker.sock: SQS y Kinesis corren dentro del proceso de Floci.
    # El socket solo hace falta para Lambda, RDS, ElastiCache y similares. Sin él,
    # Floci avisa en su log que Docker no está disponible: es esperado.
    # El HEALTHCHECK viene dentro de la imagen; por eso abajo se usa service_healthy.

  aws-init:           # crea la cola y el stream; corre una vez y termina
    profiles: ["aws"]
    image: amazon/aws-cli:2.40.3
    entrypoint: ["/bin/sh", "-c"]
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_PAGER: ""
    command:
      - |
        set -eu
        E=http://floci:4566
        aws --endpoint-url $$E sqs create-queue --queue-name guardian-events
        aws --endpoint-url $$E kinesis describe-stream-summary --stream-name guardian-events > /dev/null 2>&1 \
          || aws --endpoint-url $$E kinesis create-stream --stream-name guardian-events --shard-count 1
        echo "listo: cola y stream guardian-events"
    depends_on:
      floci: { condition: service_healthy }
    restart: "no"
  valkey:
    image: valkey/valkey:9.1.3
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10

  upstream:
    build:
      context: ../..
      args: { CMD: upstream }
    image: guardian-upstream:dev

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports:
      - "127.0.0.1:16686:16686"

  guardian:
    build:
      context: ../..
      args: { CMD: guardian, VERSION: dev }
    image: guardian:dev
    command: ["-config", "/etc/guardian/guardian.yml"]
    environment:
      GUARDIAN_PASS_KEYS: ${GUARDIAN_PASS_KEYS:?define GUARDIAN_PASS_KEYS en deploy/compose/.env}
      GUARDIAN_EVENT_SALT: ${GUARDIAN_EVENT_SALT:?define GUARDIAN_EVENT_SALT en deploy/compose/.env}
    volumes:
      - ./guardian.yml:/etc/guardian/guardian.yml:ro
    ports:
      - "127.0.0.1:8080:8080"   # el 2112 NO se publica
    depends_on:
      valkey: { condition: service_healthy }
      upstream: { condition: service_started }
      jaeger: { condition: service_started }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [guardian]

  grafana:
    image: grafana/grafana:13.0.12
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?define GRAFANA_ADMIN_PASSWORD en deploy/compose/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]

  traffic:            # tráfico de demo: docker compose --profile demo up
    profiles: ["demo"]
    image: curlimages/curl:8.11.1
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          curl -s -o /dev/null -A "Mozilla/5.0" http://guardian:8080/api/prices
          curl -s -o /dev/null http://guardian:8080/api/prices
          curl -s -o /dev/null -A "Mozilla/5.0" http://guardian:8080/
          sleep 0.3
        done
    depends_on: [guardian]

volumes:
  prom-data:
  grafana-data: