# Config de carga: Valkey real, rate alto y poco tracing.
# No uses el yaml de demo (rate 1 / burst 2, redis_addr localhost):
# mediría fail-open o 403 por rate_exceeded, no el camino Allow.
#
#   docker compose -f docker-compose.yml -f docker-compose.load.yml up -d --build
listen: ":8080"
upstream: "http://upstream:9000"
redis_addr: "valkey:6379"
app: "shop"
rate: 100000
burst: 100000
preserve_host: true
read_header_timeout: 5s
read_timeout: 20s
write_timeout: 20s
idle_timeout: 10s
shutdown_timeout: 20s
drain_delay: 5s
trusted_proxies:
  - "10.0.0.0/8"
  - "127.0.0.0/8"
  - "::1/128"
  - "172.16.0.0/12"
x_forwarded_for_header: "X-Forwarded-For"
proxy_protocol: false
scoring:
  weights:
    ua_tool: 90
    headers_incomplete: 30
    honeypot: 50
    rate_exceeded: 100
    low_browser_ratio: 15
    fake_bot: 90
    ja4_mismatch: 60
  browser_ratio_min: 0.3
  thresholds:
    challenge: 40
    block: 85
rules:
  honeypots: ["/admin-oculto", "/wp-login.php", "/.env"]
challenge:
  difficulty: 16
  ttl: 2m
  pass_ttl: 1h
modes:
  default: enforce
ja4:
  source: "tls"
tracing:
  enabled: true
  endpoint: "jaeger:4318"
  insecure: true
  sample_ratio: 0.01
  trust_incoming: false
# El middleware Logger sigue en Info; esto solo apaga el EventSink.
# Si el CPU se va en slog, lo vamos a ver en el perfil del Reto 4.
events:
  enabled: false
admin:
  enabled: true
  listen: ":9091"
  max_ttl: 168h
  cache_ttl: 2s
  stale_ttl: 1m
  lookup_timeout: 20ms
  # Reto 4: perfiles mutex y block para /debug/pprof/mutex y /block.
  # Cuestan CPU: en producción déjalos en 0 (apagado).
  mutex_profile_fraction: 5   # registra 1 de cada 5 contenciones de mutex
  block_profile_rate: 1ms     # muestrea bloqueos de 1ms o más
# Sin default_app: k6 tiene que mandar Host: shop.local.
# Si usas 127.0.0.1 como Host, recibes 421.
apps:
  - name: shop
    hosts: ["shop.local", "*.shop.local"]
  - name: api
    hosts: ["api.local"]
    modes:
      default: monitor
